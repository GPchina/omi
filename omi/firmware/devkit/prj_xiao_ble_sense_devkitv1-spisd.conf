#
# Hardware settings
#

CONFIG_GPIO=y
CONFIG_NRFX_PDM=y
CONFIG_ADC=y

# To flash via dev board
#CONFIG_BUILD_OUTPUT_UF2=n
#CONFIG_USE_DT_CODE_PARTITION=n

#
# Bluetooth settings
#

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Friend"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_DEVICE_APPEARANCE=22
CONFIG_BT_GATT_DYNAMIC_DB=y

# Max transmit power supported by nRF52840
CONFIG_BT_CTLR_TX_PWR_ANTENNA=8

# CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
# P13f: enable pairing/encryption (SMP) + bondable. The Windows WinRT
# Bluetooth stack returns GattCommunicationStatus::Unreachable when it
# discovers GATT services on an un-pairable BLE peripheral. Official omi
# firmware sets CONFIG_BT_SMP=y and Windows exposes the services normally.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# CONFIG_BT_LL_SW_SPLIT=y # Alternative implementation

# Battery and Device Information services
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MODEL="Friend DevKit 1 SPI SD"
CONFIG_BT_DIS_MANUF="Based Hardware"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.0.18-p13f"
CONFIG_BT_DIS_HW_REV_STR="Seeed Xiao BLE Sense"

# Large packets
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=30
CONFIG_BT_BUF_ACL_RX_SIZE=2048
CONFIG_BT_BUF_ACL_TX_SIZE=2048

# Windows interop fix (take 2): suspected NCS 2.7.0 SDC llcp stall/assert in
# the PHY update procedure when DLE is enabled and CONFIG_BT_MAX_CONN=1 (only
# one free node rx). Patch 4 only stopped US auto-initiating the procedures,
# but Windows (central) also initiates DLE/PHY update on connect and triggers
# the same stall. Disable both procedures entirely so neither side can start
# them; the link stays on LE 1M PHY with 27-byte PDUs (throughput is fine for
# bring-up; re-enable one at a time later to identify the culprit).
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_USER_DATA_LEN_UPDATE=n
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
# CONFIG_BT_PHY_UPDATE is not set
CONFIG_BT_USER_PHY_UPDATE=n
CONFIG_BT_AUTO_PHY_UPDATE=n

# Codecs
# CONFIG_LIBLC3=y

# Debug
# Enable the lines below to enable debug logs via UART/USB

CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
# P13b: switch to immediate (synchronous) logging for SD bring-up diagnostics.
# In deferred mode the log thread got starved by the SD-mount busy loop and the
# last log line froze mid-string, hiding which call blocked. Immediate mode
# prints each [SD] trace before its call runs, so a reset can't lose it. The old
# deferred-mode rationale (immediate console writes blocked main on a wedged USB
# CDC pipe during a log flood) no longer applies: P13 gates idle audio, so there
# is no flood, and the SD mount now runs in its own lowest-priority thread.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Debug (This value breaks some builds)
# CONFIG_ASSERT=y

# Log Levels
# CONFIG_BT_DEBUG_LOG=y
# CONFIG_BT_L2CAP_LOG_LEVEL_DBG=y
# CONFIG_BT_LOG_LEVEL_DBG=y

# CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
# CONFIG_BT_RX_STACK_SIZE=4096
# CONFIG_BT_CTLR_RX_PRIO_STACK_SIZE=4096
# CONFIG_BT_DEBUG_LOG=y
# CONFIG_LOG_BUFFER_SIZE=32000
# CONFIG_LOG_OVERRIDE_LEVEL=4
# CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
# CONFIG_BT_RX_STACK_SIZE=4096
# CONFIG_BT_CTLR_RX_PRIO_STACK_SIZE=4096

# RTT
# CONFIG_UART_CONSOLE=n
# CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048
# CONFIG_RTT_CONSOLE=y
# CONFIG_LOG_BACKEND_RTT=y
CONFIG_OMI_CODEC_OPUS=y

# Button (custom wiring: D3-P0.29 to GND, internal pull-up, press = low)
CONFIG_OMI_ENABLE_BUTTON=y

# SD Card Support (P13: SD module soldered, TF card inserted)
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=5096
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SPI=y
CONFIG_HEAP_MEM_POOL_SIZE=3048

# Increase stack and heap sizes
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- hardware bring-up fixes (required by main.c / wdog_facade.c) ---
CONFIG_FLASH=y
CONFIG_PM_DEVICE=y
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
